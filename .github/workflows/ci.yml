name: BHAVANINFO CI

on:
  push:
    branches:
      - main
      - 'phase1/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate official data
        run: npm test

      - name: Verify protected 3D renderer
        run: npm run check:3d

      - name: Build workspaces
        run: npm run build
